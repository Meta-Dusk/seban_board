name: seban_board
description: "A Flutter-Based Kanban Board with a Twist."
publish_to: "none"
version: 0.5.2+1

environment:
    sdk: ^3.11.3

dependencies:
    desktop_multi_window: ^0.3.1
    drag_and_drop_lists: ^0.4.2
    file_picker: ^12.2.0
    flutter:
        sdk: flutter
    package_info_plus: ^10.2.1
    path_provider: ^2.1.6
    shared_preferences: ^2.5.5
    win32_registry: ^3.0.3
    window_manager: ^0.5.2

dev_dependencies:
    flutter_test:
        sdk: flutter
    flutter_lints: ^6.0.0
    flutter_launcher_icons: ^0.14.4

flutter:
    uses-material-design: true
    assets:
        - assets/
        - assets/images/
        - assets/images/aespa/
        - assets/images/le_sserafim/
        - assets/images/red_velvet/
        - assets/images/new_jeans/
        - assets/images/illit/
        - assets/images/babymonster/
        - assets/images/katseye/
        - assets/images/twice/
